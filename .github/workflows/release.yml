name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing uses npm trusted publishing (OIDC), not a stored token:
# id-token: write lets the job exchange this run's OIDC token for a
# short-lived publish credential. Each package has a trusted publisher on
# npmjs.com naming this repository and this workflow's filename, release.yml,
# so renaming this file breaks every package's publishing.
permissions:
  contents: read
  id-token: write

# One release at a time: two runs racing would both see a version as
# unpublished and the second publish would fail.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish new versions
    runs-on: ubuntu-latest
    steps:
      # Full history without blobs: generatedAt is the time of the last
      # commit that changed each package.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Pin the major rather
      # than trust whichever npm the resolved Node bundles.
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Publish every version the registry does not hold yet
        run: node scripts/publish.mjs
